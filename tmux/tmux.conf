# ~/dots/tmux/tmux.conf — engagement-friendly tmux
# Symlinked to ~/.tmux.conf by install.sh

# --- General ---
set -g mouse on
set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 10
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# --- Prefix: C-a (easier than C-b), keep C-b as fallback ---
set -g prefix C-a
bind C-a send-prefix
# keep default C-b too
set -g prefix2 C-b

# --- Splits that open in the current path ---
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# --- vi-style copy mode ---
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# --- Reload config ---
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# --- Per-pane logging: prefix + P starts/stops a timestamped log ---
# Writes to ~/ops/tmux-logs/ so you keep evidence of every command run.
bind P pipe-pane -o "cat >> $HOME/ops/tmux-logs/tmux-#S-#W-#P-$(date +%Y%m%d).log" \; \
    display "toggled logging: ~/ops/tmux-logs/tmux-#S-#W-#P-$(date +%Y%m%d).log"

# --- Status bar: show session, VPN (tun0) IP, and clock ---
set -g status-interval 5
set -g status-style "bg=colour234,fg=colour250"
set -g status-left-length 40
set -g status-left "#[fg=colour154,bold] #S #[default]"
set -g status-right "#[fg=colour214]tun0:#(ip -4 -o addr show tun0 2>/dev/null | awk '{print $4}' | cut -d/ -f1) #[fg=colour250]%H:%M "
set -g window-status-current-style "fg=colour154,bold"
