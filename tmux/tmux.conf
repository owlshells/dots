# ~/dots/tmux/tmux.conf — engagement-friendly tmux
# Symlinked to ~/.tmux.conf by install.sh

# --- General ---
set -g mouse on
set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 10
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# --- Prefix: C-a (easier than C-b), keep C-b as fallback ---
set -g prefix C-a
bind C-a send-prefix
# keep default C-b too
set -g prefix2 C-b

# --- Splits that open in the current path ---
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# --- vi-style copy mode ---
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# --- Reload config ---
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# --- Per-pane logging: prefix + P starts/stops a timestamped log ---
# Writes to ~/ops/tmux-logs/ so you keep evidence of every command run.
#
# This is screen *output*, not command lines, so shell/zsh/redact.zsh does not
# cover it -- that runs from preexec, on the ledger. A secretsdump table lands
# here in cleartext. Two answers, in the order you should trust them:
#
#   tools/scrub-logs.sh   retroactive, invariant-checked, keeps a .prescrub copy
#   prefix + R            live filter through bin/rt-redact, opt-in
#
# The live filter is opt-in because rt-redact's rules are built around argv token
# shapes and pane output is not argv: the pwdump rule fires on a dumped hash
# table, most of the flag-shaped rules cannot. It lowers exposure, it does not
# remove it, and advertising it as protection would overstate what it does. The
# retroactive scrub is the path to trust.
bind P pipe-pane -o 'if [ "#{@dots_redact}" = 1 ] && command -v rt-redact >/dev/null 2>&1; then rt-redact; else cat; fi >> "$HOME/ops/tmux-logs/tmux-#S-#W-#P-$(date +%Y%m%d).log"' \; \
    display 'logging toggled: ~/ops/tmux-logs/tmux-#S-#W-#P (redaction #{?#{==:#{@dots_redact},1},on,off})'

# prefix + R toggles the live filter. It takes effect for logging started after
# it, so toggle first, then prefix + P.
bind R if -F '#{==:#{@dots_redact},1}' \
    'set -g @dots_redact 0 ; display "pane-log redaction: off"' \
    'set -g @dots_redact 1 ; display "pane-log redaction: on — restart logging with prefix + P"'

# --- Status bar: show session, VPN (tun0) IP, and clock ---
set -g status-interval 5
set -g status-style "bg=colour234,fg=colour250"
set -g status-left-length 40
set -g status-left "#[fg=colour154,bold] #S #[default]"
set -g status-right "#[fg=colour214]tun0:#(ip -4 -o addr show tun0 2>/dev/null | awk '{print $4}' | cut -d/ -f1) #[fg=colour250]%H:%M "
set -g window-status-current-style "fg=colour154,bold"
